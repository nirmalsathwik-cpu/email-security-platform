services:
  postgres:
    image: postgres:17
    container_name: email-security-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: email_security
      POSTGRES_USER: email_security
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_security -d email_security"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: